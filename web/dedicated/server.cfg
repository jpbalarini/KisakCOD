// server.cfg -- configuration of the headless dedicated server (web/tools/serve.py --dedicated, or dedicated.js --cfg=this file).
// It runs as `exec server.cfg` before the server's first map is loaded, exactly like a retail CoD4 dedicated server's server.cfg.
// Anything on the command line (--dedicated-args "+set sv_hostname Foo") comes after this file and wins.

// ---- identity -------------------------------------------------------------------------------------------------------------------------
set sv_hostname "KisakCoD4 web server"       // shown in the in-game server browser
set sv_maxclients 16                          // player slots (the relay and the players' browsers are the limit, not the engine)
//set g_password "secret"                    // uncomment to make the server private

// ---- rules ----------------------------------------------------------------------------------------------------------------------------
// Game type of the first map; the rotation below switches types with `gametype <type>`. Types: war (team deathmatch), dm, sd, dom, sab, koth, ctf
set g_gametype "war"
set scr_war_timelimit 15                      // minutes per round; 0 = no limit
set scr_war_scorelimit 1500
set scr_game_allowkillcam 1

// ---- map rotation ---------------------------------------------------------------------------------------------------------------------
// The server starts at the first entry and moves on at the end of every game. Maps in the Mac data: mp_backlot mp_bloc mp_bog mp_cargoship
// mp_citystreets mp_convoy mp_countdown mp_crash mp_crossfire mp_farm mp_overgrown mp_pipeline mp_showdown mp_strike mp_vacant (+ mp_crash_snow)
set sv_mapRotation "gametype war map mp_crash gametype war map mp_backlot gametype war map mp_strike gametype war map mp_vacant gametype war map mp_crossfire gametype war map mp_overgrown"
set sv_mapRotationCurrent ""

// ---- remote administration ------------------------------------------------------------------------------------------------------------
// The console of this server is the terminal of serve.py (type `status`, `map mp_crash`, `kick <name>`, `say <text>`).
