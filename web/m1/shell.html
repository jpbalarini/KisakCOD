<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>KisakCOD web</title>
<style>
  html, body { margin: 0; background: #111; color: #ccc; font: 13px monospace; height: 100%; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  canvas { display: block; margin: 0 auto; background: #000; max-width: 100%; cursor: none; outline: none; }
  #log { flex: 1; overflow: auto; white-space: pre-wrap; padding: 6px; border-top: 1px solid #333; min-height: 80px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas" width="1280" height="720" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="audioHint" style="display:none;position:fixed;top:8px;left:8px;padding:4px 8px;background:#000a;color:#fc6;border:1px solid #fc6;font:12px monospace;pointer-events:none">&#128263; click or press a key to enable sound</div>
  <div id="log"></div>
</div>
<script>
  var logEl = document.getElementById('log');
  function addLog(s) { logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; }
  // ---- audio: the engine's mixer thread (web/audio/al_web.cpp) calls this once its device opens. The AudioContext starts
  // suspended (autoplay policy) and is resumed by the first click/key press.
  var kisakAudio = {};
  async function kisakAudioAttach(sab, ctlPtr, ringPtr, ringFrames) {
    try {
      const ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
      await ctx.audioWorklet.addModule('audio-worklet.js');
      const node = new AudioWorkletNode(ctx, 'kisak-out', {
        numberOfInputs: 0, outputChannelCount: [2],
        processorOptions: { sab: sab, ctlPtr: ctlPtr, ringPtr: ringPtr, ringFrames: ringFrames }
      });
      node.connect(ctx.destination);
      const i32 = new Int32Array(sab), c = ctlPtr >> 2;      // read, write, outRate, consumer, underruns
      Atomics.store(i32, c + 2, Math.round(ctx.sampleRate));
      const update = () => { Atomics.store(i32, c + 3, ctx.state === 'running' ? 1 : 0); document.getElementById('audioHint').style.display = ctx.state === 'running' ? 'none' : 'block'; addLog('[audio] context ' + ctx.state + ' @' + ctx.sampleRate + ' Hz'); };
      ctx.onstatechange = update;
      update();
      const resume = () => { if (ctx.state !== 'running') ctx.resume(); };
      for (const ev of ['pointerdown', 'keydown', 'mousedown', 'touchstart']) document.addEventListener(ev, resume, true);
      const f32 = new Float32Array(sab, ringPtr, ringFrames * 2);
      // debugging aid: peak sample magnitude over the most recently mixed ~4096 frames (also tracked over time)
      const peak = () => { const w = Atomics.load(i32, c + 1) >>> 0, m = ringFrames - 1; let p = 0; for (let i = 1; i <= 4096; i++) { const idx = ((w - i) & m) * 2; p = Math.max(p, Math.abs(f32[idx]), Math.abs(f32[idx + 1])); } return p; };
      kisakAudio = { ctx: ctx, node: node, i32: i32, c: c, peak: peak, maxPeak: 0 };
      setInterval(() => { kisakAudio.maxPeak = Math.max(kisakAudio.maxPeak, peak()); }, 20);
    } catch (e) { console.warn('audio init failed', e); addLog('[audio] init failed: ' + e); }
  }
  var Module = {
    canvas: document.getElementById('canvas'),
    arguments: (new URLSearchParams(location.search).get('args') || '').split(' ').filter(Boolean),
    print: function (t) { console.log(t); addLog(t); },
    printErr: function (t) { console.warn(t); addLog(t); },
    locateFile: function (p) { return p; },
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
